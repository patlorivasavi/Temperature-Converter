<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Temperature Converter</title>

    <style>
         :root {
            --bg: linear-gradient(135deg, #667eea, #764ba2);
            --card: rgba(255, 255, 255, 0.15);
            --text: #fff;
            --btn: #00c6ff;
        }
        
        body.dark {
            --bg: linear-gradient(135deg, #141e30, #243b55);
            --card: rgba(0, 0, 0, 0.3);
            --text: #fff;
            --btn: #ff7eb3;
        }
        
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: var(--text);
        }
        
        .container {
            width: 360px;
            padding: 20px;
            background: var(--card);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        
        h2 {
            text-align: center;
        }
        
        input,
        select {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 8px;
            border: none;
            outline: none;
        }
        
        button {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            border: none;
            border-radius: 8px;
            background: var(--btn);
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        
        button:hover {
            opacity: 0.9;
        }
        
        .row {
            display: flex;
            gap: 5px;
        }
        
        .small-btn {
            width: 50%;
        }
        
        .result {
            margin-top: 10px;
            font-weight: bold;
        }
        
        .history {
            margin-top: 10px;
            max-height: 120px;
            overflow-y: auto;
            font-size: 12px;
            opacity: 0.9;
        }
        
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .icon-btn {
            width: auto;
            padding: 5px 10px;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="top-bar">
            <h2>Temperature Converter</h2>
            <button class="icon-btn" onclick="toggleTheme()">🌙</button>
        </div>

        <input type="text" id="tempInput" placeholder="Enter temperature">

        <select id="unit">
    <option value="C">Celsius (°C)</option>
    <option value="F">Fahrenheit (°F)</option>
    <option value="K">Kelvin (K)</option>
</select>

        <div class="row">
            <button class="small-btn" onclick="swapUnits()">⇄ Swap</button>
            <button class="small-btn" onclick="convert()">Convert</button>
        </div>

        <button onclick="copyResult()">Copy Result 📋</button>

        <div class="result" id="result"></div>

        <div class="history" id="history"></div>

    </div>

    <script>
        let history = [];

        function convert() {
            let temp = document.getElementById("tempInput").value;
            let unit = document.getElementById("unit").value;
            let result = document.getElementById("result");

            if (temp === "" || isNaN(temp)) {
                result.innerHTML = "❌ Please enter a valid number";
                return;
            }

            temp = parseFloat(temp);
            let output = "";

            if (unit === "C") {
                let f = (temp * 9 / 5) + 32;
                let k = temp + 273.15;
                output = `${temp}°C → ${f.toFixed(2)}°F | ${k.toFixed(2)}K`;
            } else if (unit === "F") {
                let c = (temp - 32) * 5 / 9;
                let k = c + 273.15;
                output = `${temp}°F → ${c.toFixed(2)}°C | ${k.toFixed(2)}K`;
            } else {
                let c = temp - 273.15;
                let f = (c * 9 / 5) + 32;
                output = `${temp}K → ${c.toFixed(2)}°C | ${f.toFixed(2)}°F`;
            }

            result.innerHTML = output;

            history.unshift(output);
            updateHistory();
        }

        function updateHistory() {
            document.getElementById("history").innerHTML =
                "<b>History</b><br>" + history.slice(0, 5).join("<br>");
        }

        function swapUnits() {
            let unit = document.getElementById("unit");
            unit.selectedIndex = (unit.selectedIndex + 1) % 3;
        }

        function copyResult() {
            let text = document.getElementById("result").innerText;
            navigator.clipboard.writeText(text);
            alert("Result copied!");
        }

        function toggleTheme() {
            document.body.classList.toggle("dark");
        }
    </script>

</body>

</html>
